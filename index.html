<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QAZANC — Giriş və Qeydiyyat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,Arial,sans-serif;
  min-height:100vh;
  background:#07100c;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.bg{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%,rgba(0,255,140,.12),transparent 30%),
    radial-gradient(circle at 80% 80%,rgba(0,255,140,.08),transparent 30%);
  pointer-events:none;
}
.card{
  position:relative;
  width:100%;
  max-width:440px;
  padding:34px 28px;
  border:1px solid rgba(255,255,255,.09);
  border-radius:28px;
  background:rgba(12,24,18,.82);
  backdrop-filter:blur(20px);
  box-shadow:0 30px 80px rgba(0,0,0,.5);
}
.logo{
  text-align:center;
  font-size:30px;
  font-weight:900;
  letter-spacing:2px;
  color:#42ff9b;
  margin-bottom:8px;
}
.subtitle{
  text-align:center;
  color:#8e9d95;
  margin-bottom:30px;
  font-size:14px;
}
.tabs{
  display:flex;
  background:#08150f;
  padding:5px;
  border-radius:14px;
  margin-bottom:25px;
}
.tabs button{
  width:50%;
  border:0;
  padding:13px;
  border-radius:10px;
  background:transparent;
  color:#89968f;
  cursor:pointer;
  font-weight:700;
}
.tabs button.active{
  background:#42ff9b;
  color:#06100a;
}
label{
  display:block;
  margin:15px 0 7px;
  color:#b9c6bf;
  font-size:13px;
}
input{
  width:100%;
  padding:15px;
  border-radius:13px;
  border:1px solid #26372e;
  outline:none;
  background:#09150f;
  color:#fff;
  font-size:15px;
}
input:focus{
  border-color:#42ff9b;
}
.main-btn{
  width:100%;
  margin-top:22px;
  padding:16px;
  border:0;
  border-radius:14px;
  background:#42ff9b;
  color:#06100a;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
}
.main-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}
.msg{
  min-height:22px;
  text-align:center;
  margin-top:16px;
  font-size:13px;
  color:#8e9d95;
}
.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#728079;
  text-decoration:none;
  font-size:13px;
}
</style>
</head>

<body>
<div class="bg"></div>

<div class="card">
  <div class="logo">QAZANC</div>
  <div class="subtitle">Hesabınıza daxil olun və platformanı istifadə edin</div>

  <div class="tabs">
    <button id="loginTab" class="active" onclick="showLogin()">Daxil ol</button>
    <button id="registerTab" onclick="showRegister()">Qeydiyyat</button>
  </div>

  <form id="authForm">
    <div id="nameBox" style="display:none">
      <label>Ad / istifadəçi adı</label>
      <input id="name" type="text" placeholder="İstifadəçi adınız">
    </div>

    <label>E-poçt</label>
    <input id="email" type="email" placeholder="example@gmail.com" required>

    <label>Şifrə</label>
    <input id="password" type="password" placeholder="••••••••" minlength="6" required>

    <button id="submitBtn" class="main-btn" type="submit">
      Daxil ol
    </button>

    <div id="message" class="msg"></div>
  </form>

  <a class="back" href="https://qazancim.vercel.app/">← Ana səhifəyə qayıt</a>
</div>

<script>
const SUPABASE_URL = "https://gefbhrdjddgpdeulmgru.supabase.co";
const SUPABASE_KEY = "sb_publishable_xopjwCK8Aw2wXUhIuK24Ew_lG5uCYRx";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let mode = "login";

function showLogin(){
  mode = "login";

  document.getElementById("loginTab").classList.add("active");
  document.getElementById("registerTab").classList.remove("active");

  document.getElementById("nameBox").style.display = "none";
  document.getElementById("submitBtn").textContent = "Daxil ol";
  document.getElementById("message").textContent = "";
}

function showRegister(){
  mode = "register";

  document.getElementById("registerTab").classList.add("active");
  document.getElementById("loginTab").classList.remove("active");

  document.getElementById("nameBox").style.display = "block";
  document.getElementById("submitBtn").textContent = "Qeydiyyatdan keç";
  document.getElementById("message").textContent = "";
}

document.getElementById("authForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const name = document.getElementById("name").value.trim();

  const btn = document.getElementById("submitBtn");
  const msg = document.getElementById("message");

  btn.disabled = true;
  msg.textContent = "Gözləyin...";

  if(mode === "register"){

    if(!name){
      msg.textContent = "İstifadəçi adını daxil edin.";
      btn.disabled = false;
      return;
    }

    const { data, error } = await client.auth.signUp({
      email: email,
      password: password,
      options:{
        data:{
          username:name
        }
      }
    });

    if(error){
      msg.textContent = error.message;
      btn.disabled = false;
      return;
    }

    msg.textContent = "Qeydiyyat uğurla tamamlandı.";

    if(data.session){
      window.location.href = "dashboard.html";
    }

  }else{

    const { data, error } = await client.auth.signInWithPassword({
      email: email,
      password: password
    });

    if(error){
      msg.textContent = "E-poçt və ya şifrə yanlışdır.";
      btn.disabled = false;
      return;
    }

    msg.textContent = "Giriş uğurludur...";
    window.location.href = "dashboard.html";
  }

  btn.disabled = false;
});
</script>

</body>
</html>
