<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qazanc</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#07110d;
  color:#fff;
  min-height:100vh;
}

header{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  border-bottom:1px solid #183a29;
  background:#091810;
}

.logo{
  font-size:25px;
  font-weight:900;
  color:#20e879;
}

.login{
  border:1px solid #20e879;
  padding:11px 18px;
  border-radius:12px;
  color:#20e879;
  text-decoration:none;
  font-weight:bold;
}

.hero{
  min-height:calc(100vh - 70px);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px 20px;
  background:
    radial-gradient(circle at top,#123c25 0,#07110d 55%);
}

.content{
  max-width:650px;
}

.badge{
  display:inline-block;
  padding:8px 15px;
  border-radius:30px;
  background:#12351f;
  color:#57f59a;
  font-size:13px;
  margin-bottom:20px;
}

h1{
  font-size:48px;
  line-height:1.05;
  margin-bottom:20px;
}

p{
  color:#aabbb1;
  font-size:17px;
  line-height:1.6;
  margin-bottom:30px;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

.btn{
  padding:15px 25px;
  border-radius:13px;
  font-weight:bold;
  text-decoration:none;
  cursor:pointer;
}

.primary{
  background:#20e879;
  color:#031009;
}

.secondary{
  border:1px solid #315440;
  color:#fff;
}

footer{
  position:fixed;
  bottom:0;
  width:100%;
  text-align:center;
  padding:15px;
  color:#72847a;
  font-size:12px;
}

@media(max-width:600px){
  h1{
    font-size:36px;
  }

  .hero{
    min-height:calc(100vh - 70px);
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">QAZANC</div>

  <a class="login" href="#">
    Giriş
  </a>
</header>

<section class="hero">

  <div class="content">

    <div class="badge">
      Qazanc platforması
    </div>

    <h1>
      Qazancını idarə et
    </h1>

    <p>
      Şəxsi hesabını yarat, hesab məlumatlarını
      rahat və təhlükəsiz şəkildə idarə et.
    </p>

    <div class="buttons">

      <a class="btn primary" href="#">
        Qeydiyyatdan keç
      </a>

      <a class="btn secondary" href="#">
        Daxil ol
      </a>

    </div>

  </div>

</section>

<footer>
  © 2026 Qazanc. Bütün hüquqlar qorunur.
</footer>

</body>
</html>
