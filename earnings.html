<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Qazanc — Qazanc</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at top left, #18345c 0, transparent 35%),
        radial-gradient(circle at bottom right, #102c25 0, transparent 35%),
        #070b12;
      padding: 25px 16px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .back {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #aeb9c9;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: #fff;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .card {
      background: rgba(15, 22, 34, .80);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      backdrop-filter: blur(20px);
    }

    .header {
      text-align: center;
      padding-bottom: 25px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .icon {
      width: 70px;
      height: 70px;
      margin: auto;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg,#247cff,#19c98a);
    }

    .icon svg {
      width: 34px;
      height: 34px;
    }

    h1 {
      margin-top: 15px;
      font-size: 25px;
    }

    .subtitle {
      margin-top: 7px;
      color: #8996a9;
      font-size: 13px;
    }

    .total {
      margin-top: 24px;
      padding: 22px;
      border-radius: 18px;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.07);
      text-align: center;
    }

    .total-label {
      color: #8996a9;
      font-size: 13px;
    }

    .total-value {
      margin-top: 8px;
      font-size: 34px;
      font-weight: 800;
    }

    .section {
      margin-top: 27px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 13px;
    }

    .loading,
    .empty,
    .error {
      padding: 20px;
      text-align: center;
      border-radius: 15px;
      background: rgba(255,255,255,.035);
      color: #8996a9;
      font-size: 13px;
    }

    .error {
      color: #ff8585;
      border: 1px solid rgba(255,70,70,.18);
    }

    .earning {
      padding: 17px;
      margin-bottom: 10px;
      border-radius: 15px;
      background: #0b111b;
      border: 1px solid rgba(255,255,255,.07);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .earning-left {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .earning-icon {
      width: 42px;
      height: 42px;
      min-width: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(25,201,138,.10);
      color: #4ee0ad;
    }

    .earning-icon svg {
      width: 21px;
      height: 21px;
    }

    .status {
      margin-top: 5px;
      color: #778498;
      font-size: 11px;
    }

    .amount {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
    }

    .info {
      margin-top: 25px;
      padding: 15px;
      border-radius: 14px;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.06);
      color: #7f8ca0;
      font-size: 12px;
      line-height: 1.6;
    }

    .logout {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,.09);
      background: #0b111b;
      color: #d5dce7;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-size: 14px;
      font-weight: 600;
    }

    .logout:hover {
      background: #111a28;
    }

    @media(max-width:500px) {
      .card {
        padding: 21px;
      }

      h1 {
        font-size: 22px;
      }

      .total-value {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="topbar">

    <a href="dashboard.html" class="back">
      <svg width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
      Kabinetə qayıt
    </a>

    <div class="logo">QAZANC</div>

  </div>


  <div class="card">

    <div class="header">

      <div class="icon">
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="white"
             stroke-width="1.8">
          <path d="M12 3v18"/>
          <path d="M17 7.5c0-1.7-1.9-3-5-3s-5 1.3-5 3 1.9 3 5 3 5 1.3 5 3-1.9 3-5 3-5-1.3-5-3"/>
        </svg>
      </div>

      <h1>Qazanc</h1>

      <div class="subtitle">
        Hesabınıza aid qazanc məlumatları
      </div>

    </div>


    <div class="total">

      <div class="total-label">
        Ümumi qazanc
      </div>

      <div class="total-value" id="total">
        0.00 AZN
      </div>

    </div>


    <div class="section">

      <div class="section-title">
        Qazanc tarixçəsi
      </div>

      <div id="list">
        <div class="loading">
          Məlumatlar yüklənir...
        </div>
      </div>

    </div>


    <div class="info">
      Bu bölmədə yalnız hesabınıza aid mövcud qazanc qeydləri göstərilir.
    </div>


    <button class="logout" id="logoutBtn">

      <svg width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2">
        <path d="M10 17l5-5-5-5"/>
        <path d="M15 12H3"/>
        <path d="M21 19V5a2 2 0 0 0-2-2h-7"/>
      </svg>

      Hesabdan çıxış

    </button>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://gefbhrdjddgpdeulmgru.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_xopjwCK8Aw2wXUhIuK24Ew_lG5uCYRx";

const client =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function loadEarnings() {

  const { data: userData, error: userError } =
    await client.auth.getUser();

  if (userError || !userData.user) {
    window.location.href = "index.html";
    return;
  }

  const userId = userData.user.id;


  const { data, error } =
    await client
      .from("qazanc")
      .select("id, mebleg, status")
      .eq("istifadeci_id", userId)
      .order("id", { ascending: false });


  const list =
    document.getElementById("list");

  const total =
    document.getElementById("total");


  if (error) {

    list.innerHTML =
      '<div class="error">Qazanc məlumatlarını yükləmək mümkün olmadı.</div>';

    return;
  }


  if (!data || data.length === 0) {

    total.textContent =
      "0.00 AZN";

    list.innerHTML =
      '<div class="empty">Hələ qazanc qeydi yoxdur.</div>';

    return;
  }


  let sum = 0;


  data.forEach(item => {

    sum += Number(item.mebleg || 0);

  });


  total.textContent =
    sum.toFixed(2) + " AZN";


  list.innerHTML = "";


  data.forEach(item => {

    const amount =
      Number(item.mebleg || 0).toFixed(2);

    const status =
      item.status || "qeyd";

    const row =
      document.createElement("div");

    row.className = "earning";


    row.innerHTML = `

      <div class="earning-left">

        <div class="earning-icon">

          <svg viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"
               stroke-width="2">

            <path d="M12 3v18"/>
            <path d="M17 7.5c0-1.7-1.9-3-5-3s-5 1.3-5 3 1.9 3 5 3 5 1.3 5 3-1.9 3-5 3-5-1.3-5-3"/>

          </svg>

        </div>

        <div>

          <div>Qazanc qeydi</div>

          <div class="status">
            ${status}
          </div>

        </div>

      </div>

      <div class="amount">
        +${amount} AZN
      </div>

    `;


    list.appendChild(row);

  });

}


loadEarnings();


document.getElementById("logoutBtn")
.addEventListener("click", async () => {

  await client.auth.signOut();

  window.location.href =
    "index.html";

});

</script>

</body>
</html>
