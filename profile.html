<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil — Qazanc</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at top left, #18345c 0, transparent 35%),
        radial-gradient(circle at bottom right, #102c25 0, transparent 35%),
        #070b12;
      padding: 25px 16px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .logo {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .back {
      color: #9aa7b9;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: #fff;
    }

    .title {
      margin-bottom: 20px;
    }

    .title h1 {
      font-size: 29px;
      margin-bottom: 7px;
    }

    .title p {
      color: #8491a4;
      font-size: 14px;
    }

    .card {
      background: rgba(15,22,34,.82);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
      margin-bottom: 16px;
    }

    .profile-head {
      display: flex;
      align-items: center;
      gap: 15px;
      padding-bottom: 22px;
      border-bottom: 1px solid rgba(255,255,255,.07);
      margin-bottom: 20px;
    }

    .avatar {
      width: 55px;
      height: 55px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(45,125,255,.14);
      color: #62a0ff;
    }

    .avatar svg {
      width: 28px;
      height: 28px;
    }

    .profile-head h2 {
      font-size: 18px;
      margin-bottom: 5px;
    }

    .profile-head span {
      color: #7e8b9d;
      font-size: 13px;
      word-break: break-word;
    }

    .field {
      margin-bottom: 18px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field label {
      display: block;
      color: #8c99ab;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .field input {
      width: 100%;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.035);
      color: #fff;
      border-radius: 12px;
      padding: 14px;
      outline: none;
      font-size: 14px;
    }

    .field input:focus {
      border-color: rgba(70,140,255,.55);
    }

    .save {
      width: 100%;
      margin-top: 20px;
      border: 0;
      border-radius: 13px;
      padding: 14px;
      background: #247cff;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .save:hover {
      background: #176ce7;
    }

    .message {
      margin-top: 13px;
      font-size: 13px;
      text-align: center;
      min-height: 18px;
    }

    .logout {
      width: 100%;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.035);
      color: #b8c2d0;
      border-radius: 13px;
      padding: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .logout:hover {
      background: rgba(255,255,255,.07);
      color: #fff;
    }

    .logout svg {
      width: 18px;
      height: 18px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="top">
    <div class="logo">QAZANC</div>
    <a href="dashboard.html" class="back">Kabinetə qayıt</a>
  </div>

  <div class="title">
    <h1>Profil</h1>
    <p>Hesab məlumatlarınızı idarə edin</p>
  </div>

  <div class="card">

    <div class="profile-head">

      <div class="avatar">
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="1.8">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21c.8-4 3.4-6 8-6s7.2 2 8 6"/>
        </svg>
      </div>

      <div>
        <h2 id="profileName">Hesab</h2>
        <span id="profileEmail">Yüklənir...</span>
      </div>

    </div>

    <div class="field">
      <label>İstifadəçi adı</label>
      <input
        type="text"
        id="username"
        placeholder="İstifadəçi adınızı daxil edin"
        maxlength="30">
    </div>

    <div class="field">
      <label>E-poçt</label>
      <input
        type="email"
        id="email"
        readonly>
    </div>

    <button class="save" id="saveBtn">
      Məlumatları yadda saxla
    </button>

    <div class="message" id="message"></div>

  </div>

  <div class="card">

    <button class="logout" id="logoutBtn">

      <svg viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="2">
        <path d="M10 17l5-5-5-5"/>
        <path d="M15 12H3"/>
        <path d="M21 19V5a2 2 0 0 0-2-2h-7"/>
      </svg>

      Hesabdan çıxış

    </button>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://gefbhrdjddgpdeulmgru.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_xopjwCK8Aw2wXUhIuK24Ew_lG5uCYRx";

const client =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function loadProfile() {

  const { data, error } =
    await client.auth.getUser();

  if (error || !data.user) {
    window.location.href = "index.html";
    return;
  }

  const user = data.user;

  const username =
    user.user_metadata?.username || "";

  const email =
    user.email || "";

  document.getElementById("username")
    .value = username;

  document.getElementById("email")
    .value = email;

  document.getElementById("profileEmail")
    .textContent = email;

  document.getElementById("profileName")
    .textContent =
      username || "Hesab";

}


document.getElementById("saveBtn")
  .addEventListener("click", async () => {

    const username =
      document.getElementById("username")
        .value.trim();

    const message =
      document.getElementById("message");

    if (!username) {
      message.textContent =
        "İstifadəçi adı boş ola bilməz.";
      return;
    }

    const { error } =
      await client.auth.updateUser({
        data: {
          username: username
        }
      });

    if (error) {

      message.textContent =
        "Məlumatları yadda saxlamaq mümkün olmadı.";

      return;
    }

    document.getElementById("profileName")
      .textContent = username;

    message.textContent =
      "Məlumatlar uğurla yadda saxlanıldı.";

  });


document.getElementById("logoutBtn")
  .addEventListener("click", async () => {

    await client.auth.signOut();

    window.location.href =
      "index.html";

  });


loadProfile();

</script>

</body>
</html>
