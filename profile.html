<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil — Qazanc</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at top left, #18345c 0, transparent 35%),
        radial-gradient(circle at bottom right, #102c25 0, transparent 35%),
        #070b12;
      padding: 25px 16px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #b9c5d6;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: #fff;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .card {
      background: rgba(15, 22, 34, .78);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      backdrop-filter: blur(20px);
    }

    .profile-head {
      text-align: center;
      padding-bottom: 28px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .avatar {
      width: 82px;
      height: 82px;
      margin: auto;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg,#247cff,#19c98a);
      box-shadow: 0 15px 35px rgba(36,124,255,.25);
    }

    .avatar svg {
      width: 40px;
      height: 40px;
    }

    h1 {
      margin-top: 16px;
      font-size: 25px;
    }

    .email {
      color: #8e9bad;
      margin-top: 7px;
      font-size: 14px;
      word-break: break-word;
    }

    .section {
      margin-top: 28px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: #aab6c7;
      margin-bottom: 12px;
    }

    label {
      display: block;
      color: #aab6c7;
      font-size: 13px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 15px 16px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,.09);
      outline: none;
      background: #0a101a;
      color: #fff;
      font-size: 15px;
    }

    input:focus {
      border-color: #247cff;
      box-shadow: 0 0 0 3px rgba(36,124,255,.10);
    }

    .button {
      width: 100%;
      margin-top: 12px;
      padding: 15px;
      border: 0;
      border-radius: 13px;
      cursor: pointer;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      background: linear-gradient(135deg,#247cff,#19a9ff);
      transition: .2s;
    }

    .button:hover {
      transform: translateY(-1px);
      opacity: .95;
    }

    .logout {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,.09);
      background: #0b111b;
      color: #d5dce7;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .logout:hover {
      background: #111a28;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 11px;
      font-size: 13px;
      text-align: center;
    }

    .success {
      display: block;
      background: rgba(25,201,138,.10);
      border: 1px solid rgba(25,201,138,.25);
      color: #55e0ae;
    }

    .error {
      display: block;
      background: rgba(255,70,70,.10);
      border: 1px solid rgba(255,70,70,.25);
      color: #ff8585;
    }

    .info-box {
      margin-top: 24px;
      padding: 15px;
      border-radius: 14px;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.06);
      color: #8794a7;
      font-size: 12px;
      line-height: 1.6;
    }

    @media(max-width:500px) {
      .card {
        padding: 21px;
        border-radius: 20px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="topbar">
    <a href="dashboard.html" class="back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
      Kabinetə qayıt
    </a>

    <div class="logo">QAZANC</div>
  </div>

  <div class="card">

    <div class="profile-head">

      <div class="avatar">
        <svg viewBox="0 0 24 24" fill="none"
             stroke="white" stroke-width="1.8">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21c.8-4 3.4-6 8-6s7.2 2 8 6"/>
        </svg>
      </div>

      <h1>Profil</h1>
      <div class="email" id="email">Yüklənir...</div>

    </div>

    <div class="section">

      <div class="section-title">Profil məlumatları</div>

      <label for="username">İstifadəçi adı</label>

      <input
        type="text"
        id="username"
        placeholder="İstifadəçi adınızı yazın"
        maxlength="30"
      >

      <button class="button" id="saveBtn">
        Məlumatları yadda saxla
      </button>

      <div id="message" class="message"></div>

    </div>

    <div class="info-box">
      Profil məlumatlarınız hesabınızla əlaqələndirilir.
      Buradan yalnız profil məlumatlarını dəyişə bilərsiniz.
    </div>

    <button class="logout" id="logoutBtn">

      <svg width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2">
        <path d="M10 17l5-5-5-5"/>
        <path d="M15 12H3"/>
        <path d="M21 19V5a2 2 0 0 0-2-2h-7"/>
      </svg>

      Hesabdan çıxış

    </button>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://gefbhrdjddgpdeulmgru.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_xopjwCK8Aw2wXUhIuK24Ew_lG5uCYRx";

const client =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let currentUser = null;

async function loadProfile() {

  const { data, error } =
    await client.auth.getUser();

  if (error || !data.user) {
    window.location.href = "index.html";
    return;
  }

  currentUser = data.user;

  document.getElementById("email").textContent =
    currentUser.email || "";

  const username =
    currentUser.user_metadata?.username || "";

  document.getElementById("username").value =
    username;
}

loadProfile();


document.getElementById("saveBtn")
.addEventListener("click", async () => {

  const username =
    document.getElementById("username")
    .value.trim();

  const message =
    document.getElementById("message");

  if (!username) {
    message.textContent =
      "İstifadəçi adı boş ola bilməz.";

    message.className =
      "message error";

    return;
  }

  if (username.length < 3) {
    message.textContent =
      "İstifadəçi adı ən azı 3 simvol olmalıdır.";

    message.className =
      "message error";

    return;
  }

  const { error } =
    await client.auth.updateUser({
      data: {
        username: username
      }
    });

  if (error) {

    message.textContent =
      error.message;

    message.className =
      "message error";

    return;
  }

  message.textContent =
    "Profil məlumatları yadda saxlanıldı.";

  message.className =
    "message success";
});


document.getElementById("logoutBtn")
.addEventListener("click", async () => {

  await client.auth.signOut();

  window.location.href =
    "index.html";

});

</script>

</body>
</html>
