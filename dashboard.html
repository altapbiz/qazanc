<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kabinet — Qazanc</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at top left, #18345c 0, transparent 35%),
        radial-gradient(circle at bottom right, #102c25 0, transparent 35%),
        #070b12;
      padding: 25px 16px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      margin: auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logout {
      border: 1px solid rgba(255,255,255,.09);
      background: rgba(255,255,255,.04);
      color: #c8d1df;
      padding: 10px 14px;
      border-radius: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logout:hover {
      background: rgba(255,255,255,.08);
    }

    .welcome {
      margin-bottom: 24px;
    }

    .welcome h1 {
      font-size: 29px;
      margin-bottom: 7px;
    }

    .email {
      color: #8996a9;
      font-size: 14px;
      word-break: break-word;
    }

    .balance {
      padding: 26px;
      border-radius: 22px;
      background:
        linear-gradient(
          135deg,
          rgba(36,124,255,.18),
          rgba(25,201,138,.09)
        );
      border: 1px solid rgba(255,255,255,.08);
      margin-bottom: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }

    .balance-label {
      color: #9ba8ba;
      font-size: 13px;
    }

    .balance-value {
      margin-top: 8px;
      font-size: 38px;
      font-weight: 800;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .menu-card {
      text-decoration: none;
      color: #fff;
      padding: 23px;
      min-height: 150px;
      border-radius: 20px;
      background: rgba(15,22,34,.78);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 15px 40px rgba(0,0,0,.22);
      transition: .2s;
    }

    .menu-card:hover {
      transform: translateY(-3px);
      border-color: rgba(36,124,255,.35);
      background: rgba(20,30,45,.9);
    }

    .menu-icon {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(36,124,255,.10);
      color: #5b9cff;
      margin-bottom: 17px;
    }

    .menu-icon svg {
      width: 23px;
      height: 23px;
    }

    .menu-title {
      font-size: 16px;
      font-weight: 700;
    }

    .menu-description {
      margin-top: 6px;
      color: #7f8ca0;
      font-size: 12px;
      line-height: 1.5;
    }

    .notice {
      margin-top: 20px;
      padding: 16px;
      border-radius: 15px;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.06);
      color: #7f8ca0;
      font-size: 12px;
      line-height: 1.6;
    }

    @media(max-width:650px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .welcome h1 {
        font-size: 25px;
      }

      .balance-value {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="topbar">

    <div class="logo">QAZANC</div>

    <button class="logout" id="logoutBtn">

      <svg width="18" height="18"
           viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="2">

        <path d="M10 17l5-5-5-5"/>
        <path d="M15 12H3"/>
        <path d="M21 19V5a2 2 0 0 0-2-2h-7"/>

      </svg>

      Çıxış

    </button>

  </div>


  <div class="welcome">

    <h1 id="welcomeText">
      Xoş gəlmisiniz
    </h1>

    <div class="email" id="email">
      Yüklənir...
    </div>

  </div>


  <div class="balance">

    <div class="balance-label">
      Hesab balansı
    </div>

    <div class="balance-value" id="balance">
      0.00 AZN
    </div>

  </div>


  <div class="grid">

    <a href="profile.html" class="menu-card">

      <div class="menu-icon">

        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="1.8">

          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21c.8-4 3.4-6 8-6s7.2 2 8 6"/>

        </svg>

      </div>

      <div class="menu-title">
        Profil
      </div>

      <div class="menu-description">
        Hesab məlumatlarını idarə et
      </div>

    </a>


    <a href="earnings.html" class="menu-card">

      <div class="menu-icon">

        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="1.8">

          <path d="M12 3v18"/>
          <path d="M17 7.5c0-1.7-1.9-3-5-3s-5 1.3-5 3 1.9 3 5 3 5 1.3 5 3-1.9 3-5 3-5-1.3-5-3"/>

        </svg>

      </div>

      <div class="menu-title">
        Qazanc
      </div>

      <div class="menu-description">
        Qazanc məlumatlarına bax
      </div>

    </a>


    <a href="payments.html" class="menu-card">

      <div class="menu-icon">

        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="1.8">

          <rect x="3" y="5" width="18" height="14" rx="2"/>
          <path d="M3 10h18"/>
          <path d="M7 15h4"/>

        </svg>

      </div>

      <div class="menu-title">
        Ödənişlər
      </div>

      <div class="menu-description">
        Ödəniş sorğularını və tarixçəni gör
      </div>

    </a>

  </div>


  <div class="notice">
    Hesab məlumatlarınız təhlükəsiz şəkildə Supabase hesabınızla
    əlaqələndirilir.
  </div>

</div>


<script>

const SUPABASE_URL =
  "https://gefbhrdjddgpdeulmgru.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_xopjwCK8Aw2wXUhIuK24Ew_lG5uCYRx";

const client =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function loadDashboard() {

  const { data, error } =
    await client.auth.getUser();


  if (error || !data.user) {

    window.location.href = "index.html";

    return;
  }


  const user =
    data.user;


  const email =
    user.email || "";


  const username =
    user.user_metadata?.username || "";


  document.getElementById("email")
    .textContent = email;


  document.getElementById("welcomeText")
    .textContent =
      username
        ? "Xoş gəlmisiniz, " + username
        : "Xoş gəlmisiniz";


  /*
    Profil balansı burada yalnız
    mövcud profiles məlumatından oxunur.
    Avtomatik pul artırılmır.
  */

  const { data: profile } =
    await client
      .from("profiles")
      .select("balance")
      .eq("id", user.id)
      .maybeSingle();


  if (profile && profile.balance !== null) {

    document.getElementById("balance")
      .textContent =
        Number(profile.balance).toFixed(2) + " AZN";

  } else {

    document.getElementById("balance")
      .textContent =
        "0.00 AZN";

  }

}


loadDashboard();


document.getElementById("logoutBtn")
  .addEventListener("click", async () => {

    await client.auth.signOut();

    window.location.href =
      "index.html";

  });

</script>

</body>
</html>
